<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- Mobile support -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be My Valentine 💘</title>

<style>
    body {
        background: #000;
        color: #fff;
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 20px;
    }

    img {
        width: 90%;
        max-width: 320px;
        margin: 20px auto;
        display: block;
    }

    h1 {
        font-size: 1.8rem;
        margin: 10px 0 20px;
    }

    .buttons {
        position: relative;
        width: 100%;
        max-width: 320px;
        height: 200px;
        margin: 0 auto;
    }

    button {
        font-size: 1.2rem;
        padding: 12px 28px;
        border: none;
        border-radius: 40px;
        cursor: pointer;
        position: absolute;
        touch-action: manipulation;
    }

    #yesBtn {
        background: #ff3366;
        color: white;
        left: 15%;
        top: 70px;
    }

  #noBtn {
        background: #777;
        color: white;
        font-size: 0.9rem;      /* smaller text */
        padding: 6px 14px;      /* smaller button */
        left: 55%;
        top: 80px;
    }

    #message {
        display: none;
        font-size: 1.6rem;
        margin-top: 30px;
        color: #ff66cc;
    }
</style>

<script>
   function moveNoButton() {
        const noBtn = document.getElementById("noBtn");

        // Use the full screen instead of small box
        const maxX = window.innerWidth - noBtn.offsetWidth - 20;
        const maxY = window.innerHeight - noBtn.offsetHeight - 20;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.position = "fixed"; // escape the container
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }


    function sayYes() {
        document.getElementById("message").style.display = "block";
        document.querySelector(".buttons").style.display = "none";
    }
</script>

</head>
<body>

    <img src="will-you-be-my-valentine-be-my-valentine.gif" alt="Valentine">

    <h1>Will you be my Valentine💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">YES 💘</button>
        <button id="noBtn"
                onmouseover="moveNoButton()"
                ontouchstart="moveNoButton()">
            NO
        </button>
    </div>

    <div id="message">
        YAYYYY 💕😍<br>
        Best. Valentine. Ever. 💍💖
    </div>

</body>
</html>
